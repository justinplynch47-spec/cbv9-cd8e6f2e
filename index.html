<script>
// Standalone store: stands in for the claude.ai runtime so the app works with no account.
// Data stays in this browser (localStorage), keyed "cbv9:<path>". Same API surface the app calls.
(function(){
  const P = "cbv9:", subs = new Set();
  const all = () => { const o = {}; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith(P)) o[k.slice(P.length)] = k; } return o; };
  const read = p => { try{ const v = localStorage.getItem(P+p); return v ? JSON.parse(v) : null; }catch(e){ return null; } };
  const snapDoc = (id, v) => ({ id, exists: v != null, data: () => v && JSON.parse(JSON.stringify(v)) });
  function query(coll, order, lim){
    const pre = coll + "/";
    let docs = Object.keys(all()).filter(p => p.startsWith(pre) && !p.slice(pre.length).includes("/"))
      .map(p => snapDoc(p.slice(pre.length), read(p)));
    if(order){ const [f, dir] = order; docs.sort((a,b) => { const x = a.data()[f], y = b.data()[f]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === "desc" ? -1 : 1); }); }
    if(lim) docs = docs.slice(0, lim);
    return { docs };
  }
  function coll(path, order, lim){
    return {
      orderBy: (f, dir) => coll(path, [f, dir || "asc"], lim),
      limit: n => coll(path, order, n),
      onSnapshot(cb){ const s = () => cb(query(path, order, lim)); subs.add(s); setTimeout(s, 0); return () => subs.delete(s); }
    };
  }
  const fire = () => subs.forEach(s => { try{ s(); }catch(e){ console.warn(e); } });
  const db = {
    collection: p => coll(p),
    doc: p => ({
      get: async () => snapDoc(p.split("/").pop(), read(p)),
      set: async body => { try{ localStorage.setItem(P+p, JSON.stringify(body)); }catch(e){ throw { code: "storage_full" }; } fire(); }
    })
  };
  const downloads = { save: async ({ filename, data }) => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/csv" }));
    a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } };
  const user = { id: async () => "me" };
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  window.claude = { use: async n => ({ db, user, downloads })[n] || null };
})();
</script>

  if(el){ el.textContent = `${Math.floor(left/60)}:${pad(left%60)}`; const b = $("#timer-bar"); if(b) b.style.width = (restTotal?Math.max(0,Math.min(100,100*(1-left/restTotal))):100)+"%";
    if(left===0 && !$("#timer").classList.contains("zero")){ $("#timer").classList.add("zero"); beep(); } }
}
let audioCtx = null;
function beep(){ try{ if(!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.25); }catch(e){} }
function startRest(sec){ restTotal = sec; restEnd = Date.now() + sec*1000; if(!timerHandle) timerHandle = setInterval(tick, 250); try{ if(!audioCtx){ const A = window.AudioContext||window.webkitAudioContext; if(A) audioCtx = new A(); } audioCtx && audioCtx.resume && audioCtx.resume(); }catch(e){} }
document.addEventListener("visibilitychange", async () => { if(document.visibilityState==="visible"){ tick(); if(activeId && navigator.wakeLock && !wakeLock?.released===false){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} } } });

function bindLog(){
  document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => openStart(b.dataset.start));
  document.querySelectorAll("[data-resume]").forEach(b => b.onclick = () => { activeId = b.dataset.resume; cur = JSON.parse(JSON.stringify(data.logs[activeId])); render(); });
  if(!cur) return;
  const s = Object.assign({}, SESS[cur.sessionId]); s.exercises = sessExercises(SESS[cur.sessionId], cur); const w = Math.max(1, cur.week||1), ex = s.exercises[exIdx];
  const L = () => (cur.exercises[ex.id] = cur.exercises[ex.id] || { name: ex.name, muscle: ex.muscle, sets: {} });
  $("#l-back").onclick = () => { tab = "today"; render(); };
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { exIdx = +b.dataset.ex; draft = null; render(); });
  document.querySelectorAll("[data-step]").forEach(b => {
    const go = () => { const [k,d] = b.dataset.step.split(":"); readDraftInputs(); const step = k==="load" ? (ex.incr||1) : 1;
      draft[k] = Math.max(0, +(draft[k] + (+d)*step).toFixed(2)); const i = $(k==="load"?"#d-load":"#d-reps"); if(i) i.value = draft[k]; };
    let hold = null; b.onclick = go;
    b.onpointerdown = () => { hold = setTimeout(function rep(){ go(); hold = setTimeout(rep, 110); }, 450); };
    ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(hold)));
  });
  document.querySelectorAll("[data-rir]").forEach(b => b.onclick = () => { readDraftInputs(); draft.rir = +b.dataset.rir; document.querySelectorAll("[data-rir]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.rir===draft.rir))); });
  $("#l-log").onclick = () => {
    readDraftInputs(); if(!(draft.reps > 0)){ toast("Enter reps first."); return; }
    const le = L(), n = Object.keys(le.sets).length + 1;
    le.sets[n] = { load: draft.load, reps: draft.reps, rir: draft.rir, t: Date.now() };
    const hist = bestBefore(ex.id, cur.date), here = Math.max(0, ...Object.entries(le.sets).filter(([k]) => +k !== n).map(([,v]) => e1rm(v)));
    if(hist > 0 && e1rm(le.sets[n]) > Math.max(hist, here)) le.sets[n].pr = true;
    const prTxt = le.sets[n].pr ? " · PR!" : "";
    persistCur();
    const planned = setsFor(ex, w, cur.readiness, cur.short);
    if(n === planned && finActive(ex, w) && !(le.fin||[]).length){ restEnd = 0; toast(`Set ${n} logged${prTxt} · finisher next`); draft = null; render(); return; }
    if(ex.group){
      const nx = groupNext(s, ex);
      if(nx){ restEnd = 0; toast(`Set ${n} logged${prTxt} · now ${groupLabels(s.exercises)[nx.id]}`); exIdx = s.exercises.indexOf(nx); draft = null; render(); return; }
      startRest(groupRest(s, ex));
      const first = groupMembers(s, ex).find(needsSets); const after = s.exercises.indexOf(groupMembers(s, ex).slice(-1)[0]) + 1;
      const exId = ex.id; toast(`Set ${n} logged${prTxt} · rest`, { label: "Undo", fn: () => { if(!cur || !cur.exercises[exId]) return; delete cur.exercises[exId].sets[n]; persistCur(); restEnd = 0; draft = null; render(); } });
      exIdx = first ? s.exercises.indexOf(first) : Math.min(after, s.exercises.length-1); draft = null; render(); return;
    }
    startRest(ex.restSec);
    const exId = ex.id; toast(`Set ${n} logged${prTxt}`, { label: "Undo", fn: () => { if(!cur || !cur.exercises[exId]) return; delete cur.exercises[exId].sets[n]; persistCur(); restEnd = 0; draft = null; render(); } });
    if(n >= planned && exIdx < s.exercises.length-1){ setTimeout(() => { exIdx++; draft = null; render(); }, 400); }
    draft = null; render();
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const le = L(), n = b.dataset.del; const kept = Object.entries(le.sets).filter(([k])=>k!==n).sort((a,b)=>a[0]-b[0]).map(([,v])=>v);
    le.sets = Object.fromEntries(kept.map((v,i)=>[String(i+1),v])); persistCur(); draft = null; render(); });
  document.querySelectorAll("[data-swap]").forEach(b => b.onclick = () => { const le = L(); le.swappedTo = b.dataset.swap || null; persistCur(); render(); });
  $("#l-skip").onclick = () => { const le = L(); le.skipped = !le.skipped; persistCur(); if(le.skipped && exIdx < s.exercises.length-1){ exIdx++; draft = null; } render(); };
  const note = $("#l-note"); if(note) note.onchange = () => { L().note = note.value; persistCur(); };
  $("#l-prev").onclick = () => { exIdx = Math.max(0, exIdx-1); draft = null; render(); };
  const nx = $("#l-next"); if(nx) nx.onclick = () => { exIdx++; draft = null; render(); };
  const fl = $("#f-log"); if(fl) fl.onclick = () => { const load = num($("#f-load").value), reps = num($("#f-reps").value);
    if(!(reps > 0)){ toast("Enter finisher reps first."); return; } const le = L(); le.fin = (le.fin||[]).concat([{ load: load ?? 0, reps: Math.round(reps), t: Date.now() }]); persistCur(); toast(`F${le.fin.length} logged`); render(); };
  document.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => { const le = L(); le.fin = (le.fin||[]).filter((_,k) => k !== +b.dataset.fdel); persistCur(); render(); });
  const fd = $("#f-done"); if(fd) fd.onclick = () => {
    if(ex.group){ const nxt = groupNext(s, ex); if(nxt){ exIdx = s.exercises.indexOf(nxt); draft = null; render(); return; }
      startRest(groupRest(s, ex)); const m = groupMembers(s, ex), first = m.find(needsSets); exIdx = first ? s.exercises.indexOf(first) : Math.min(s.exercises.indexOf(m[m.length-1]) + 1, s.exercises.length-1); }
    else { startRest(ex.restSec); if(exIdx < s.exercises.length-1) exIdx++; }
    draft = null; render(); };
  const f1 = $("#l-finish"); if(f1) f1.onclick = () => $("#finish")?.scrollIntoView({behavior:"smooth"});
  document.querySelectorAll("[data-feel]").forEach(b => b.onclick = () => { cur.feeling = +b.dataset.feel; document.querySelectorAll("[data-feel]").forEach(x=>x.setAttribute("aria-pressed", String(+x.dataset.feel===cur.feeling))); });
  const f2 = $("#l-finish2"); if(f2) f2.onclick = async () => { cur.note = $("#l-snote").value; cur.finishedAt = Date.now(); restEnd = 0; await persistCur();
    try{ wakeLock && wakeLock.release(); }catch(e){} toast("Session saved"); activeId = null; cur = null; exIdx = 0; tab = "today"; render(); scrollTo(0,0); };
  if(restEnd){ $("#t-plus").onclick = () => { restEnd += 15000; restTotal += 15; tick(); }; $("#t-skip").onclick = () => { restEnd = 0; render(); }; if(!timerHandle) timerHandle = setInterval(tick, 250); }
}
function readDraftInputs(){ const l = num($("#d-load")?.value), r = num($("#d-reps")?.value); if(l != null) draft.load = l; if(r != null) draft.reps = Math.round(r); }

// ---------- PROGRESS ----------
function viewProgress(){
  const curW = Math.max(1, Math.min(16, weekOf(todayIso()))), pw = progWeek || curW;
  const sets = setsByMuscle(pw), tg = targetsFor(pw);
  return `<header><p class="eyebrow">Progress</p><h1>Week ${curW} of 16</h1></header>
  <section class="card"><div class="row between"><h3>Sets by muscle · week ${pw}</h3><div class="row"><button class="btn sm" id="p-prev" ${pw<=1?"disabled":""} aria-label="Previous week">‹</button><button class="btn sm" id="p-next" ${pw>=16?"disabled":""} aria-label="Next week">›</button></div></div>
    <p class="small muted">Effective hard sets: presses count ½ to triceps, rows and pulldowns ½ to biceps. Arms: 12 direct sets ≈ 19 effective. ${modeFor(pw)==="fallback"?"Fallback targets.":weekPlan(pw).setsMult!==1?`Targets scaled ×${weekPlan(pw).setsMult} for this week.`:""}</p>
    <div class="bars">${MUSCLE_KEYS.map(m => { const v = sets[m], t = tg[m], max = Math.max(t.hi*1.25, v, 1);
      const st = v < t.lo ? ["Under","s-warn"] : v > t.hi ? ["Over","s-info"] : ["In range","s-ok"];
      return `<div class="mbar"><span>${esc(META.muscles[m].label)}</span><span class="track"><span class="fill" style="width:${100*v/max}%"></span><span class="tick" style="left:${100*t.lo/max}%"></span><span class="tick" style="left:${100*t.hi/max}%"></span></span><span class="val">${+v.toFixed(1)} / ${t.lo}-${t.hi} <span class="status ${st[1]}" style="font-size:11px">${st[0]}</span></span></div>`; }).join("")}</div></section>
  ${keyLiftCard(curW)}`;
}
function bestE1(exId, wks){ let best = 0; Object.values(data.logs).filter(l => wks.includes(l.week)).forEach(l => Object.values(l.exercises?.[exId]?.sets||{}).forEach(st => { if(st.reps>0) best = Math.max(best, e1rm(st)); })); return best || null; }
// Weekly best e1RM for one key lift, weeks 1-16: a single series, so no legend; the row label names it.
function keySpark(id){
  const W = 170, H = 40, P = 5, pts = WEEKS.map(wp => [wp.week, bestE1(id, [wp.week])]).filter(([,v]) => v);
  const name = esc(EXBYID[id].name.split(",")[0]);
  if(pts.length < 2) return `<div class="spark"><span>${name}</span><span class="small muted">Trend after 2 weeks</span></div>`;
  const lo = Math.min(...pts.map(p=>p[1])), hi = Math.max(...pts.map(p=>p[1])), span = (hi - lo) || 1;
  const x = w => P + (w-1)*(W-2*P)/15, y = v => H - P - (v - lo)*(H-2*P)/span;
  const line = pts.map(([w,v]) => `${x(w).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<div class="spark"><span>${name} <span class="muted small num">${Math.round(pts[pts.length-1][1])}</span></span>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${name}: weekly best estimated 1RM, ${pts.map(([w,v])=>`week ${w} ${Math.round(v)}`).join(", ")}">
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(([w,v]) => `<circle cx="${x(w).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>Week ${w}: ${Math.round(v)} lb e1RM</title></circle>`).join("")}</svg></div>`;
}
function keyLiftCard(curW){
  const rows = META.keyLifts.map(id => { const bench = bestE1(id,[3,4]); let latest = null, lw = null;
    for(let w = curW; w >= 5 && !latest; w--){ if(weekPlan(w).phase === "deload") continue; latest = bestE1(id,[w]); lw = w; }
    const pct = bench && latest ? latest/bench : null;
    const st = pct==null ? ["–",""] : pct >= .97 ? ["Holding","s-ok"] : pct >= .93 ? ["Amber","s-warn"] : ["Red","s-danger"];
    return `<tr><td>${esc(EXBYID[id].name.split(",")[0])}</td><td class="num">${bench?Math.round(bench):"–"}</td><td class="num">${latest?Math.round(latest)+` <span class="muted small">wk ${lw}</span>`:"–"}</td><td><span class="status ${st[1]}">${pct?Math.round(pct*100)+"% ":""}${st[0]}</span></td></tr>`; });
  const reds = rows.filter(r => r.includes(">Red<")).length;
  return `<section class="card"><h3>Key lifts</h3><p class="small muted">Estimated 1RM including reps in reserve. Benchmark = best of weeks 3-4. Holding ≥ 97%, amber 93-97%, red &lt; 93%.</p>
    <div class="tablewrap"><table><thead><tr><th>Lift</th><th>Wk 3-4</th><th>Latest</th><th>Status</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    <div>${META.keyLifts.map(id => keySpark(id)).join("")}</div>
    ${reds>=2?`<div class="banner danger"><p class="small"><b>Red flag:</b> 2+ key lifts under 93%. Take an early deload: half sets, 4+ RIR, 5-7 days.</p></div>`:""}</section>`;
}
function bindProgress(){
  const p = $("#p-prev"), n = $("#p-next"), cw = Math.max(1, Math.min(16, weekOf(todayIso())));
  if(p) p.onclick = () => { progWeek = Math.max(1, (progWeek||cw)-1); render(); };
  if(n) n.onclick = () => { progWeek = Math.min(16, (progWeek||cw)+1); render(); };
}

// ---------- PLAN ----------
function viewPlan(){
  const segs = [["weeks","Weeks"],["sessions","Sessions"],["rules","Rules"],["evidence","Evidence"],["settings","Settings"]];
  const body = { weeks: planWeeks, sessions: planSessions, rules: planRules, evidence: planEvidence, settings: planSettings }[planSeg]();
  return `<header><p class="eyebrow">Plan</p><h1>16-week cut</h1><p class="muted small">Start ${esc(fmtDate(META.startDate))} · 6 sessions a week · 3-day fallback</p></header>
  <div class="seg" role="group" aria-label="Plan sections">${segs.map(([k,l])=>`<button data-seg="${k}" aria-pressed="${planSeg===k}">${l}</button>`).join("")}</div>${body}`;
}
function planWeeks(){
  const cw = weekOf(todayIso());
  return `<section class="card"><div class="tablewrap"><table><thead><tr><th>Wk</th><th>Phase</th><th>Vol</th><th>RIR c / i</th><th>Mode</th></tr></thead><tbody>${WEEKS.map(wp=>`<tr ${wp.week===cw?'style="background:var(--surface-2)"':""}><td class="num"><b>${wp.week}</b></td><td>${esc(wp.label)}</td><td class="num">×${wp.setsMult}</td><td class="num">${esc(wp.rirCompound)} / ${esc(wp.rirIsolation)}</td>
    <td><button class="btn sm" data-mode="${wp.week}">${modeFor(wp.week)==="fallback"?"Fallback":"Full"}</button></td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">Vol scales every exercise's sets. RIR: compounds / isolation; elbow-crossing isolation gets +1. Tap Full/Fallback to switch a week.</p></section>`;
}
function planSessions(){
  return PLAN.sessions.map(s => `<section class="card"><div class="row between"><h3>${esc(s.id)} · ${esc(s.title)}</h3><span class="muted small">${s.day.toUpperCase()} · ~${estMin(s)} min</span></div>
    <div class="tablewrap"><table><thead><tr><th>Exercise</th><th>Sets × reps</th><th>Rest</th></tr></thead><tbody>${(GL => s.exercises.map(e=>{ const alt = (e.variants||[])[1]; return `<tr><td>${GL[e.id]?`<b>${GL[e.id]}</b> `:""}${esc(e.name)}${e.technique?`<br><span class="small">${esc(e.technique)}${e.techniqueB&&e.techniqueB!==e.technique?` · <b>wks 5-8, 13-16:</b> ${esc(e.techniqueB)}`:""}</span>`:""}${alt?`<br><span class="small"><b>${e.rotate==="week"?"Even weeks":"Weeks 5-8, 13-16"}:</b> ${esc(alt.name)}</span>`:""}${e.finisher?`<br><span class="small s-info">Finisher, build weeks: ${esc(e.finisher)}</span>`:""}${e.elbowNote?`<br><span class="small muted">${esc(e.elbowNote)}</span>`:""}</td><td class="num">${e.sets} × ${e.repLo}-${e.repHi}${e.perSide?"/leg":""}</td><td class="num">${fmtRest(e.restSec)}</td></tr>`; }).join(""))(groupLabels(s.exercises))}</tbody></table></div></section>`).join("");
}
function planRules(){
  const R = META.rules, sec = (t, a) => `<section class="card"><h3>${t}</h3><ul class="rules">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`;
  return `<section class="card" style="border-color:var(--danger)"><h3>Stop and get care</h3><ul class="rules">${R.safety.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>` + sec("Advanced work", R.advanced) + sec("Short on time", R.trim) + sec("Switch to the 3-day fallback when", R.fallbackEnter) + sec("Return to the full week", R.fallbackExit)
    + sec("Progression and red flags", R.progression) + sec("Golfer's elbow", R.elbow)
    + sec("Cardio", R.cardio)
    + `<section class="card"><p class="small muted">This plan was built by an AI panel from published research. It is not medical advice. Check bloodwork, a new pain, or anything that worries you with your physician.</p></section>`;
}
function planEvidence(){
  return `<section class="card"><p class="small muted">Each claim the plan leans on, with its source. <b>Verified</b> = the paper was found and the claim matches its abstract. <b>Not trial-tested</b> = panel judgment or coaching practice.</p>${PLAN.evidence.map(e=>`<div class="ev"><div class="row between"><b>${esc(e.topic)}</b><span class="tag ${e.verified?"s-ok":"s-warn"}">${e.verified?"Verified":"Not trial-tested"}</span></div><p class="small">${esc(e.claim)}</p><p class="small muted">${esc(e.source)}</p>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url.replace(/^https?:\/\//,""))}</a>`:""}</div>`).join("")}</section>`;
}
function planSettings(){
  const th = document.documentElement.dataset.theme || "system";
  return `<section class="card"><h3>Theme</h3><div class="seg">${["system","light","dark"].map(t=>`<button data-theme-set="${t}" aria-pressed="${th===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></section>
  <section class="card"><h3>Export for your Mac</h3><p class="small muted">Two CSV files that open in Excel: every logged set and weekly sets by muscle.</p>${dl?`<button class="btn" id="s-export">Export CSVs</button>`:`<p class="small muted">Export isn't available in this view.</p>`}</section>
  <section class="card"><h3>Add to your iPhone</h3><p class="small">In Safari, tap Share, then <b>Add to Home Screen</b>. It opens like an app.</p></section>`;
}
function bindPlan(){
  document.querySelectorAll("[data-seg]").forEach(b => b.onclick = () => { planSeg = b.dataset.seg; render(); });
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { const w = +b.dataset.mode, m = Object.assign({}, appState().weekMode); if(modeFor(w)==="fallback") delete m[wk(w)]; else m[wk(w)] = "fallback"; saveApp({weekMode:m}); });
  document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => { const t = b.dataset.themeSet; if(t==="system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; try{ t==="system"?localStorage.removeItem("v9-theme"):localStorage.setItem("v9-theme", t); }catch(e){} render(); });
  const ex = $("#s-export"); if(ex) ex.onclick = exportCsv;
}
const csv = rows => "﻿" + rows.map(r => r.map(v => { const s = v==null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(",")).join("\n");
async function exportCsv(){
  const d = todayIso(), logs = Object.values(data.logs).sort((a,b)=>a.date.localeCompare(b.date));
  const sets = [["date","week","phase","mode","session","exercise_id","exercise","muscle","set","load_lb","reps","rir","e1rm"]];
  logs.forEach(l => Object.entries(l.exercises||{}).forEach(([id,e]) => { Object.entries(e.sets||{}).forEach(([n,s]) => sets.push([l.date,l.week,l.phase,l.mode,l.sessionId,id,e.swappedTo||e.name,e.muscle,n,s.load,s.reps,s.rir,Math.round(e1rm(s))]));
    (e.fin||[]).forEach((f,k) => sets.push([l.date,l.week,l.phase,l.mode,l.sessionId,id,e.swappedTo||e.name,e.muscle,"F"+(k+1),f.load,f.reps,"",""])); }));
  const weeks = [["week","phase","mode"].concat(MUSCLE_KEYS.map(m=>m+"_sets"))];
  for(let w=1; w<=16; w++){ const s = setsByMuscle(w); weeks.push([w, WEEKS[w-1].phase, modeFor(w)].concat(MUSCLE_KEYS.map(m=>+s[m].toFixed(1)))); }
  for(const [name, rows] of [[`v9_sets_${d}.csv`, sets], [`v9_weekly_${d}.csv`, weeks]]){
    try{ await dl.save({ filename: name, data: csv(rows) }); }
    catch(e){ if(e?.code === "declined") continue; toast(e?.code === "rate_limited" ? "Too many downloads at once. Try again in a minute." : "Export didn't finish. Try again."); return; }
  }
  toast("Export done");
}

ready = connect(); render();
})();
